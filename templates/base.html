<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Planner{% endblock %} — StudyPlan</title>

  <!-- Google Fonts: Syne (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

{% block navbar %}
{% if session.get('user_id') %}
<nav class="navbar">
  <a class="navbar-brand" href="{{ url_for('dashboard') }}">
    <i class="bi bi-calendar3"></i> StudyPlan
  </a>

  <!-- Hamburger for mobile -->
  <button class="nav-hamburger" id="navToggle" onclick="toggleNav()" aria-label="Menu">
    <i class="bi bi-list"></i>
  </button>

  <div class="nav-links" id="navLinks">
    <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
      <i class="bi bi-grid-1x2"></i> Dashboard
    </a>
    <a href="{{ url_for('timetable_view') }}" class="nav-link {% if request.endpoint == 'timetable_view' %}active{% endif %}">
      <i class="bi bi-table"></i> Timetable
    </a>
    <a href="{{ url_for('analytics') }}" class="nav-link {% if request.endpoint == 'analytics' %}active{% endif %}">
      <i class="bi bi-bar-chart-line"></i> Analytics
    </a>
    <a href="{{ url_for('pomodoro') }}" class="nav-link {% if request.endpoint == 'pomodoro' %}active{% endif %}">
      <i class="bi bi-stopwatch"></i> Pomodoro
    </a>
    <a href="{{ url_for('suggestions_page') }}" class="nav-link {% if request.endpoint == 'suggestions_page' %}active{% endif %}">
      <i class="bi bi-lightbulb"></i> Suggestions
    </a>
    <div class="nav-divider"></div>
    <span class="nav-user"><i class="bi bi-person-circle"></i> {{ session['username'] }}</span>
    <a href="{{ url_for('logout') }}" class="nav-link logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
    <button class="notif-nav-btn" id="navNotifBtn" title="Toggle study reminders" onclick="navNotifToggle()">
      <i class="bi bi-bell" id="navBellIcon"></i>
    </button>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
      <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
    </button>
  </div>
</nav>
{% endif %}
{% endblock %}

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
